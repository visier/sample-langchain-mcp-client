<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP App sandbox</title>
  <style>html,body{height:100%;margin:0;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
(() => {
  let view = null;
  function cspValue(csp = {}) {
    const resources = csp.resourceDomains?.join(' ') || '';
    return [
      "default-src 'none'",
      "object-src 'none'",
      `connect-src ${csp.connectDomains?.join(' ') || "'none'"}`,
      `script-src 'self' 'unsafe-inline' ${resources}`,
      `style-src 'self' 'unsafe-inline' ${resources}`,
      `img-src 'self' data: ${resources}`,
      `font-src 'self' data: ${resources}`,
      `media-src 'self' data: ${resources}`,
      `frame-src ${csp.frameDomains?.join(' ') || "'none'"}`,
      `base-uri ${csp.baseUriDomains?.join(' ') || "'self'"}`,
    ].join('; ');
  }
  function withCsp(html, csp) {
    const value = cspValue(csp).replaceAll('&', '&amp;').replaceAll('"', '&quot;');
    const meta = `<meta http-equiv="Content-Security-Policy" content="${value}">`;
    return /<head[\s>]/i.test(html)
      ? html.replace(/<head([^>]*)>/i, `<head$1>${meta}`)
      : `${meta}${html}`;
  }
  function allowValue(permissions = {}) {
    return [
      permissions.camera && 'camera',
      permissions.microphone && 'microphone',
      permissions.geolocation && 'geolocation',
      permissions.clipboardWrite && 'clipboard-write',
    ].filter(Boolean).join('; ');
  }
  window.addEventListener('message', (event) => {
    if (event.source === window.parent) {
      const message = event.data;
      if (message?.method === 'ui/notifications/sandbox-resource-ready') {
        view?.remove();
        view = document.createElement('iframe');
        view.title = 'MCP App view';
        view.setAttribute('sandbox', message.params?.sandbox || 'allow-scripts allow-same-origin');
        const allow = allowValue(message.params?.permissions);
        if (allow) view.allow = allow;
        view.srcdoc = withCsp(message.params?.html || '', message.params?.csp || {});
        document.body.appendChild(view);
      } else if (!message?.method?.startsWith('ui/notifications/sandbox-')) {
        view?.contentWindow?.postMessage(message, '*');
      }
    } else if (view && event.source === view.contentWindow
        && !event.data?.method?.startsWith('ui/notifications/sandbox-')) {
      window.parent.postMessage(event.data, '*');
    }
  });
  window.parent.postMessage({
    jsonrpc: '2.0',
    method: 'ui/notifications/sandbox-proxy-ready',
    params: {},
  }, '*');
})();
</script>
</body>
</html>
